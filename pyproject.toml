[project]
name = "powerfc"
version = "0.1.0"
description = "Day-ahead power price forecasting for the German (DE-LU) bidding zone from free fundamental data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",        # Parquet engine
    "requests>=2.31",     # HTTP calls to SMARD and Open-Meteo
    "holidays>=0.50",     # German public holidays (calendar features)
    "python-dotenv>=1.0", # reads the ENTSO-E token from a local .env file
    "entsoe-py>=0.6",     # optional ENTSO-E Transparency Platform client
    "scikit-learn>=1.4",  # linear model + metrics
    "lightgbm>=4.3",      # gradient-boosted trees
    "matplotlib>=3.8",    # charts
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerfc"]
